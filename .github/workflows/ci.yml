# CI do SHVIA-BENCH — achado G-24 da revisão de 01/09/2026.
#
# ## Por que este repo precisa MAIS que os outros
#
# Aqui se MEDE. O CLAUDE.md diz que "verde precisa significar N checks rodaram", e a suíte
# tem piso de cobertura justamente para que apagar checks conte como falha.
#
# O achado G-40 mostrou o que acontece sem CI: o `tests/run_all.sh` foi escrito e validado
# só no macOS e **não rodava no Linux** — `mktemp -t sb-test` sem `XXXXXX`, que o BSD aceita
# e o GNU recusa. As 8 suítes eram reportadas como FALHOU **sem nunca terem rodado**, e o
# piso acusava `? < 60`. Chamadas à mão, todas passavam.
#
# É o pior defeito possível num repo de medição, e a única coisa que o teria pego é
# exatamente isto: alguém rodando a suíte no Linux, sempre.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Suíte offline (sem rede, sem chave, sem docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # `test_leb_offline.py` needs the LEB (AI-BENCHMARK) next to it, and without it the suite
      # is SKIPPED, taking with it the **7 anti-contamination checks** — "golden does NOT contain
      # private/matrix/probe" and "prompt does NOT leak the answer matrix". They are the only
      # automatic proof that the model never receives the answer key.
      #
      # 🔴 0.8.18 assumed the AI-BENCHMARK was private and out of CI's reach, and left this job
      # red on purpose. Measured on 25/09/2026: the repository is PUBLIC (this repo's CLAUDE.md
      # already said so), so a plain clone reaches it with no key. The owner's answer the same
      # day: CI brings it. It is cloned OUTSIDE the workspace, into the runner's temp dir, so no
      # check that walks this repository sees another repository's files.
      #
      # Unpinned on purpose, like the local setup (`~/x/AI-BENCHMARK`, cloned next to this repo):
      # the checks guard the task source as it is today. A change there that leaks the matrix
      # should turn this job red, and pinning a commit would hide exactly that.
      #
      # The network is used only here, to fetch the task source. The suite itself stays offline.
      - name: Clone the LEB (AI-BENCHMARK) next to the suite
        run: |
          git clone --quiet --depth 1 https://github.com/samirhvbr/AI-BENCHMARK "$RUNNER_TEMP/AI-BENCHMARK"
          echo "LEB_ROOT=$RUNNER_TEMP/AI-BENCHMARK" >> "$GITHUB_ENV"
      # ⚠️ Measured on 21/09/2026: this comment used to CLAIM that `run_all.sh` fails by itself
      # when a suite is SKIPPED. It did not — `exit "$FAILED"` ignored the skip counter.
      #
      # ✅ The owner's decision on 24/09/2026 (panel card `bench-ci-suite-pulada`, option b):
      # zero tolerance. `BENCH_SKIP_MAX: "0"` fails this job whenever a suite is skipped. With
      # the LEB cloned above, nothing should skip; if something does, red says "a check did not
      # run", which is true. Do not raise the ceiling to make the job green: that is the lie
      # this line exists to stop.
      - name: tests/run_all.sh
        env:
          BENCH_SKIP_MAX: "0"
        run: bash tests/run_all.sh
